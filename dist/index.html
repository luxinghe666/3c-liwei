<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4659d6">
  <meta name="description" content="3C 供应链财务工作台联机测试版。">
  <title>财务工作台 · 3C 供应链</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./auth.css">
</head>
<body>
  <div class="app-shell">
    <button class="sidebar-overlay" id="overlay" aria-label="关闭导航"></button>
    <aside class="sidebar" id="sidebar">
      <a href="#overview" class="brand" aria-label="财务工作台首页"><span class="brand-mark">财</span><span><span class="brand-name">财务工作台</span><span class="brand-sub">3C 供应链 · 经营账</span></span></a>
      <div class="nav-section">工作空间</div><nav id="nav" aria-label="主导航"></nav>
      <div class="sidebar-bottom"><div class="sidebar-note"><span class="status-dot"></span>原型演示空间<small>模拟数据 · 当前浏览器保存</small></div><div class="sidebar-foot"><span class="avatar">财</span><div><strong id="roleName">财务视角</strong><small class="sync-status">连接账本中</small></div><button class="button ghost small" id="switchRole" title="切换演示视角" aria-label="切换演示视角">⇄</button></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="row"><button class="mobile-menu button ghost" id="menuButton" aria-label="打开导航">☰</button><div class="breadcrumb">工作空间 <span>/</span> <strong id="crumb">经营概览</strong></div></div><div class="topbar-actions"><span class="demo-badge">交互原型 · 演示数据</span><label class="month-picker"><span>期间</span><input id="monthPicker" type="month" value="2026-10" aria-label="报表月份"></label><button class="button ghost small" id="helpButton" aria-label="原型说明">?</button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer">仅供确认页面与流程 · 未接入真实账本、银行或博远 ERP</footer>
    </div>
  </div>
  <dialog id="modal" class="modal" aria-labelledby="modalTitle"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p>此交互原型需要启用 JavaScript。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
